<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Baptismal Invitation</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #fff;
    }
    #canva {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    #musicActivator {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: transparent;
      cursor: pointer;
    }
    #soundcloud {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -10px;
      top: -10px;
      opacity: 0;
      pointer-events: none;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="canva"
    src="https://workwithmelovemose.canva.link/"
    title="Baptismal Invitation"
    allow="fullscreen"
    allowfullscreen>
  </iframe>

  <div
    id="musicActivator"
    aria-label="Open invitation"
    role="button"
    tabindex="0">
  </div>

  <script>
    const activator = document.getElementById("musicActivator");

    const SOUND_CLOUD_URL =
      "https://w.soundcloud.com/player/" +
      "?url=https%3A//api.soundcloud.com/tracks/soundcloud%253Atracks%253A2407410558" +
      "&color=%230066cc" +
      "&auto_play=true" +
      "&hide_related=true" +
      "&show_comments=false" +
      "&show_user=false" +
      "&show_reposts=false" +
      "&show_teaser=false" +
      "&visual=false";

    let musicStarted = false;

    function startMusic() {
      if (musicStarted) return;
      musicStarted = true;

      const player = document.createElement("iframe");
      player.id = "soundcloud";
      player.src = SOUND_CLOUD_URL;
      player.setAttribute("scrolling", "no");
      player.setAttribute("frameborder", "no");
      player.setAttribute("allow", "autoplay; encrypted-media");
      player.setAttribute("title", "Background music");

      document.body.appendChild(player);
      activator.remove();
    }

    activator.addEventListener("pointerdown", startMusic, {
      once: true,
      passive: true
    });

    activator.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        startMusic();
      }
    });
  </script>
</body>
</html>
